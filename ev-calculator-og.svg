<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1d23"/>
  <!-- Top accent bar: EV blue left, ICE orange right -->
  <rect x="0"   y="0" width="600" height="5" fill="#4a9eff"/>
  <rect x="600" y="0" width="600" height="5" fill="#ff8c5e"/>

  <!-- Logo -->
  <text x="72" y="96" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="5" fill="#4a9eff">SHORT</text>
  <text x="208" y="96" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="5" fill="#ff8c5e">SPECS</text>

  <!-- Main headline -->
  <text x="72" y="230" font-family="Arial,sans-serif" font-size="86" font-weight="700" fill="#ebedf0" letter-spacing="-2">EV vs ICE</text>
  <text x="72" y="330" font-family="Arial,sans-serif" font-size="52" font-weight="600" fill="#c8ccd2" letter-spacing="-1">Cost Calculator</text>

  <!-- Subtitle (Thai) -->
  <text x="72" y="400" font-family="Arial,sans-serif" font-size="26" fill="#9ba0a8">เปรียบเทียบต้นทุนและจุดคุ้มทุน · ค่าพลังงาน · ประกัน · บำรุงรักษา</text>

  <!-- URL -->
  <text x="72" y="570" font-family="Arial,sans-serif" font-size="22" fill="#4a9eff">shortspecs.com/tools/ev-vs-ice-calculator</text>

  <!-- EV card -->
  <rect x="860" y="160" width="260" height="120" rx="14" fill="#0d2a4a" stroke="#4a9eff" stroke-width="2"/>
  <text x="990" y="225" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#4a9eff" text-anchor="middle">EV</text>
  <text x="990" y="258" font-family="Arial,sans-serif" font-size="16" fill="#4a9eff" text-anchor="middle" opacity="0.7">ไฟฟ้า</text>

  <!-- VS -->
  <text x="990" y="318" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#555b63" text-anchor="middle">VS</text>

  <!-- ICE card -->
  <rect x="860" y="330" width="260" height="120" rx="14" fill="#3a1a0a" stroke="#ff8c5e" stroke-width="2"/>
  <text x="990" y="395" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ff8c5e" text-anchor="middle">ICE</text>
  <text x="990" y="428" font-family="Arial,sans-serif" font-size="16" fill="#ff8c5e" text-anchor="middle" opacity="0.7">น้ำมัน</text>
</svg>
